name: Validate Go PAA template

on:
  push:
  pull_request:

jobs:
  paa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Checkout pinned PAA contract source
        uses: actions/checkout@v4
        with:
          repository: Personal-AI-Architecture/the-architecture
          ref: main
          fetch-depth: 0
          path: paa-source
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Checkout shared PAA validator
        uses: actions/checkout@v4
        with:
          repository: Personal-AI-Architecture/paa-conformance-validator
          path: paa-validator
      - name: Validate current PAA contracts and template commands
        run: node paa-validator/bin/paa-validate.js --target paa.target.json --source-checkout paa-source --source-ref HEAD
      - name: Validate running Gateway and restart persistence
        run: node paa-validator/bin/paa-live-target.js --target paa.target.json
      - name: Validate configured provider and model
        run: node paa-validator/bin/paa-provider-target.js --target paa.target.json
      - name: Run Go suite and source drift gate
        run: go run ./cmd/validate -source-checkout paa-source
